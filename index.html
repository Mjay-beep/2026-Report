<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채널UX 신규안</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100vh;
    background: #fafafa;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    color: #1a1a1a;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .grid {
    display: grid;
    gap: 14px;
    grid-template-columns: 1fr;
    width: 100%;
    max-width: 640px;
  }
  @media (min-width: 560px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
  .card {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    background: #fff;
    border: 1px solid #ececec;
    border-radius: 20px;
    font-size: 64px;
    font-weight: 600;
    color: #1a1a1a;
    letter-spacing: -1px;
    transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover { border-color: #1a1a1a; }
  .card:active { transform: scale(0.98); }
</style>
</head>
<body>
  <div class="grid">
    <a class="card" href="./채널 컨셉UX - 신규안 테스트/prototype1.html">A</a>
    <a class="card" href="./채널 컨셉UX - 신규안 테스트/prototype2.html">B</a>
    <a class="card" href="./채널 컨셉UX - 신규안 테스트/prototype3.html">C</a>
  </div>
</body>
</html>
